# This is a basic workflow to help you get started with Actions

name: Build docker image for simple java app

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Simple java app docker image creation
        run: docker build -t simple-java-app:latest -f sample-java-app-docker-file .

      - name: Show all images
        run: docker images

      - name: Run Simple java app docker image as container
        run: docker run --name simple-java-app-container -d simple-java-app:latest

      - name: Show all containers
        run: docker ps

      - name: Show history of simple-java-app image
        run: docker history simple-java-app

      - name: Stop simple-java-app container
        run: docker stop simple-java-app-container

      - name: Run simple java image in integrated mode
        run: docker run --name simple-java-app-container -it simple-java-app:latest







